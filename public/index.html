<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>社交广告平台 - 本地预览</title>
    <style>
      :root {
        color-scheme: light;
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        --bg: #eef4ff;
        --card: rgba(255, 255, 255, .86);
        --text: #0f172a;
        --muted: #64748b;
        --primary: #2563eb;
        --primary-2: #7c3aed;
        --success: #16a34a;
        --warning: #f59e0b;
        --border: rgba(148, 163, 184, .28);
        --shadow: 0 24px 70px rgba(30, 41, 59, .14);
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        color: var(--text);
        background:
          radial-gradient(circle at top left, rgba(37, 99, 235, .23), transparent 32rem),
          radial-gradient(circle at top right, rgba(124, 58, 237, .22), transparent 30rem),
          linear-gradient(180deg, #f8fbff 0%, var(--bg) 100%);
      }
      .hero { padding: 34px 24px 22px; }
      .hero-inner { max-width: 1180px; margin: 0 auto; display: grid; grid-template-columns: 1.4fr .8fr; gap: 24px; align-items: stretch; }
      .hero-panel {
        position: relative;
        overflow: hidden;
        padding: 34px;
        color: #fff;
        border-radius: 32px;
        background: linear-gradient(135deg, #1d4ed8, #7c3aed 55%, #db2777);
        box-shadow: var(--shadow);
      }
      .hero-panel::after { content: ""; position: absolute; width: 260px; height: 260px; right: -70px; top: -70px; border-radius: 999px; background: rgba(255,255,255,.18); }
      .hero h1 { position: relative; margin: 0 0 14px; font-size: clamp(30px, 5vw, 56px); line-height: 1.05; letter-spacing: -.04em; }
      .hero p { position: relative; margin: 0; max-width: 680px; color: rgba(255,255,255,.86); font-size: 17px; line-height: 1.7; }
      .hero-actions { position: relative; display: flex; gap: 12px; flex-wrap: wrap; margin-top: 24px; }
      .status-card { padding: 24px; border-radius: 28px; background: var(--card); border: 1px solid var(--border); box-shadow: var(--shadow); backdrop-filter: blur(14px); }
      .status-card h2 { margin: 0 0 14px; font-size: 20px; }
      .status-list { display: grid; gap: 12px; }
      .status-item { display: flex; justify-content: space-between; align-items: center; padding: 12px 14px; border-radius: 16px; background: rgba(248,250,252,.86); border: 1px solid var(--border); }
      .pill { display: inline-flex; align-items: center; gap: 6px; padding: 7px 12px; border-radius: 999px; font-size: 13px; font-weight: 800; background: rgba(37, 99, 235, .1); color: #1d4ed8; }
      main { max-width: 1180px; margin: 0 auto; padding: 0 24px 36px; display: grid; grid-template-columns: minmax(0, 1.7fr) minmax(320px, .9fr); gap: 24px; }
      .card { background: var(--card); border: 1px solid var(--border); border-radius: 26px; box-shadow: 0 18px 45px rgba(30, 41, 59, .08); padding: 22px; margin-bottom: 18px; backdrop-filter: blur(14px); }
      .section-title { display: flex; justify-content: space-between; align-items: center; gap: 12px; margin-bottom: 14px; }
      .section-title h2, .card h2 { margin: 0; font-size: 20px; }
      .notice { border-left: 6px solid var(--primary); }
      .notice strong { display: block; font-size: 17px; margin-bottom: 6px; }
      .banner { position: relative; min-height: 220px; border-radius: 28px; overflow: hidden; margin-bottom: 18px; box-shadow: var(--shadow); background: linear-gradient(135deg, #172554, #2563eb); }
      .banner img { width: 100%; height: 100%; min-height: 220px; object-fit: cover; display: block; }
      .banner::after { content: "广告位展示"; position: absolute; right: 18px; top: 18px; color: #fff; background: rgba(15,23,42,.35); padding: 7px 12px; border-radius: 999px; font-size: 12px; font-weight: 800; }
      textarea, input, select { width: 100%; border: 1px solid var(--border); border-radius: 16px; padding: 13px 14px; font-size: 14px; margin: 8px 0 12px; outline: none; background: rgba(255,255,255,.9); transition: .2s ease; }
      textarea:focus, input:focus, select:focus { border-color: rgba(37,99,235,.65); box-shadow: 0 0 0 4px rgba(37,99,235,.12); }
      button, .button { display: inline-flex; align-items: center; justify-content: center; gap: 8px; border: 0; background: linear-gradient(135deg, var(--primary), var(--primary-2)); color: #fff; border-radius: 999px; padding: 11px 18px; cursor: pointer; font-weight: 900; box-shadow: 0 12px 24px rgba(37,99,235,.22); text-decoration: none; }
      button.secondary { background: #0f172a; box-shadow: 0 12px 24px rgba(15,23,42,.18); }
      button.ghost { color: #1d4ed8; background: rgba(37,99,235,.1); box-shadow: none; }
      .post { transition: transform .2s ease, box-shadow .2s ease; }
      .post:hover { transform: translateY(-2px); box-shadow: var(--shadow); }
      .post h3 { margin: 0 0 8px; display: flex; align-items: center; gap: 10px; }
      .avatar { width: 38px; height: 38px; border-radius: 14px; display: inline-grid; place-items: center; color: #fff; background: linear-gradient(135deg, #2563eb, #7c3aed); font-weight: 900; }
      .meta { color: var(--muted); font-size: 13px; line-height: 1.7; }
      .actions { display: flex; gap: 10px; margin-top: 14px; align-items: center; flex-wrap: wrap; }
      .grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
      .metric { background: linear-gradient(180deg, rgba(255,255,255,.98), rgba(248,250,252,.86)); padding: 16px; border-radius: 18px; border: 1px solid var(--border); }
      .metric span { color: var(--muted); font-size: 12px; text-transform: uppercase; }
      .metric strong { font-size: 28px; display: block; margin-top: 4px; }
      .tag { display: inline-block; background: #dcfce7; color: #166534; padding: 4px 10px; border-radius: 999px; font-size: 12px; font-weight: 900; }
      .mini-table { width: 100%; border-collapse: collapse; overflow: hidden; border-radius: 16px; }
      .mini-table td { padding: 10px 0; border-bottom: 1px solid var(--border); font-size: 13px; }
      .mini-table td:last-child { text-align: right; color: var(--muted); }
      .two-cols { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
      @media (max-width: 960px) { .hero-inner, main { grid-template-columns: 1fr; } .hero-panel { padding: 26px; } }
      @media (max-width: 560px) { .two-cols, .grid { grid-template-columns: 1fr; } .hero, main { padding-left: 14px; padding-right: 14px; } }
    </style>
  </head>
  <body>
    <header class="hero">
      <div class="hero-inner">
        <section class="hero-panel">
          <span class="pill">🚀 Social Ad Platform</span>
          <h1>社交圈子 + 广告付费投放平台</h1>
          <p>用户可以发圈、上传图片、点赞评论；运营方可以配置公告、广告位、广告套餐和订单审核。当前页面是零依赖预览模式，方便快速验收产品方向。</p>
          <div class="hero-actions">
            <a class="button" href="#publish">立即发布动态</a>
            <a class="button ghost" href="#adConfig">配置广告套餐</a>
          </div>
        </section>
        <aside class="status-card">
          <h2>当前预览能力</h2>
          <div class="status-list">
            <div class="status-item"><span>动态信息流</span><span class="pill">已接入</span></div>
            <div class="status-item"><span>手机号入库</span><span class="pill">可模拟</span></div>
            <div class="status-item"><span>广告购买</span><span class="pill">可模拟</span></div>
            <div class="status-item"><span>广告配置</span><span class="pill">新增</span></div>
          </div>
        </aside>
      </div>
    </header>
    <main>
      <section>
        <div id="notice" class="card notice"></div>
        <div id="banner" class="banner"></div>
        <div id="publish" class="card">
          <div class="section-title"><h2>发布动态</h2><span class="pill">图文动态</span></div>
          <textarea id="postContent" rows="4" placeholder="输入你想发布的内容，例如：今天平台上线了广告付费功能..."></textarea>
          <button onclick="createPost()">发布到圈子</button>
        </div>
        <div class="section-title"><h2>圈子动态</h2><span class="meta">置顶优先，按时间倒序</span></div>
        <div id="posts"></div>
      </section>
      <aside>
        <div class="card">
          <h2>登录与手机号</h2>
          <p class="meta">模拟小程序微信登录和手机号授权入库。</p>
          <div class="actions">
            <button onclick="login()">模拟微信登录</button>
            <button class="secondary" onclick="bindPhone()">手机号入库</button>
          </div>
          <p id="userInfo" class="meta">未登录</p>
        </div>
        <div class="card">
          <h2>广告购买</h2>
          <p class="meta">选择套餐后模拟创建广告订单，支付成功后等待后台审核。</p>
          <select id="packageSelect"></select>
          <input id="adTitle" placeholder="广告标题" value="本地商家活动" />
          <button onclick="createAdOrder()">模拟购买广告</button>
          <div id="orders" class="meta"></div>
        </div>
        <div id="adConfig" class="card">
          <h2>广告配置管理</h2>
          <p class="meta">运营后台可配置广告位和广告套餐。</p>
          <input id="positionName" placeholder="广告位名称" value="首页弹窗广告" />
          <input id="positionPrice" placeholder="每日价格" value="199.00" />
          <button onclick="createPosition()">新增广告位</button>
          <div class="two-cols">
            <input id="packageDays" placeholder="投放天数" value="3" />
            <input id="packagePrice" placeholder="套餐价格" value="499.00" />
          </div>
          <input id="packageName" placeholder="套餐名称" value="弹窗广告 3 天" />
          <button class="secondary" onclick="createPackage()">新增广告套餐</button>
          <div id="adConfigSummary" class="meta"></div>
        </div>
        <div class="card">
          <h2>后台统计</h2>
          <div id="stats" class="grid"></div>
        </div>
      </aside>
    </main>
    <script>
      const api = async (url, options = {}) => {
        const response = await fetch(url, { headers: { 'content-type': 'application/json', ...(options.headers || {}) }, ...options });
        return response.json();
      };

      async function load() {
        const announcements = await api('/api/announcements');
        document.querySelector('#notice').innerHTML = `<strong>📢 ${announcements[0]?.title || '暂无公告'}</strong><p class="meta">${announcements[0]?.content || ''}</p>`;

        const ads = await api('/api/ads');
        document.querySelector('#banner').innerHTML = ads[0] ? `<img src="${ads[0].imageUrl}" alt="${ads[0].title}" />` : '';

        const packages = await api('/api/ad-packages');
        document.querySelector('#packageSelect').innerHTML = packages.map((item) => `<option value="${item.id}" data-position="${item.positionId}">${item.name} / ￥${item.price}</option>`).join('');

        await Promise.all([loadPosts(), loadStats(), loadOrders(), loadAdConfig()]);
      }

      async function login() {
        const data = await api('/api/auth/wx-login', { method: 'POST', body: JSON.stringify({ code: Date.now().toString(), nickname: '本地预览用户' }) });
        localStorage.setItem('token', data.token);
        document.querySelector('#userInfo').textContent = `已登录：${data.user.nickname}`;
      }

      async function bindPhone() {
        const data = await api('/api/auth/wx-phone', { method: 'POST', body: JSON.stringify({ phone: '13800138000' }) });
        document.querySelector('#userInfo').textContent = `手机号已入库：${data.phone}`;
      }

      async function createPost() {
        const content = document.querySelector('#postContent').value.trim();
        if (!content) return alert('请输入动态内容');
        await api('/api/posts', { method: 'POST', body: JSON.stringify({ content, images: [] }) });
        document.querySelector('#postContent').value = '';
        await loadPosts();
        await loadStats();
      }

      async function likePost(id) {
        await api(`/api/posts/${id}/like`, { method: 'POST' });
        await loadPosts();
      }

      async function loadPosts() {
        const data = await api('/api/posts');
        document.querySelector('#posts').innerHTML = data.list.map((post) => `
          <article class="card post">
            <h3><span class="avatar">${(post.user?.nickname || '用').slice(0, 1)}</span>${post.user?.nickname || '用户'} ${post.isTop ? '<span class="tag">置顶</span>' : ''}</h3>
            <p>${post.content}</p>
            <p class="meta">${new Date(post.createdAt).toLocaleString()}</p>
            <div class="actions"><button onclick="likePost('${post.id}')">点赞</button><span class="pill">👍 ${post.likeCount}</span><span class="pill">💬 ${post.commentCount}</span></div>
          </article>`).join('');
      }

      async function createAdOrder() {
        const select = document.querySelector('#packageSelect');
        const option = select.selectedOptions[0];
        const data = await api('/api/ad-orders', { method: 'POST', body: JSON.stringify({ packageId: select.value, positionId: option.dataset.position, title: document.querySelector('#adTitle').value }) });
        alert(`订单已创建：${data.order.orderNo}，本地模式模拟支付成功，等待审核。`);
        await loadOrders();
        await loadStats();
      }

      async function loadOrders() {
        const orders = await api('/api/my/ad-orders');
        document.querySelector('#orders').innerHTML = orders.length
          ? `<table class="mini-table">${orders.map((item) => `<tr><td>${item.orderNo}</td><td>￥${item.payAmount}</td></tr>`).join('')}</table>`
          : '暂无广告订单';
      }

      async function createPosition() {
        await api('/api/admin/ad-positions', {
          method: 'POST',
          body: JSON.stringify({
            name: document.querySelector('#positionName').value,
            code: `custom_${Date.now()}`,
            pricePerDay: document.querySelector('#positionPrice').value,
          }),
        });
        await loadAdConfig();
      }

      async function createPackage() {
        const positions = await api('/api/admin/ad-positions');
        await api('/api/admin/ad-packages', {
          method: 'POST',
          body: JSON.stringify({
            positionId: positions[0]?.id || '1',
            name: document.querySelector('#packageName').value,
            days: Number(document.querySelector('#packageDays').value || 1),
            price: document.querySelector('#packagePrice').value,
          }),
        });
        await load();
      }

      async function loadAdConfig() {
        const positions = await api('/api/admin/ad-positions');
        const packages = await api('/api/admin/ad-packages');
        document.querySelector('#adConfigSummary').innerHTML = `广告位：${positions.length} 个<br />广告套餐：${packages.length} 个`;
      }

      async function loadStats() {
        const stats = await api('/api/admin/statistics');
        document.querySelector('#stats').innerHTML = Object.entries(stats).map(([key, value]) => `<div class="metric"><span>${key}</span><strong>${value}</strong></div>`).join('');
      }

      load();
    </script>
  </body>
</html>
